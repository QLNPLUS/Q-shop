name: Publish to CurseForge

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to build and publish
        required: true
        type: string
      neoforge_ref:
        description: NeoForge branch or tag to build
        required: false
        default: neoforge-1.21.1
        type: string
      loader:
        description: Loader to publish when running manually
        required: false
        default: all
        type: choice
        options:
          - all
          - forge
          - neoforge

permissions:
  contents: write

concurrency:
  group: curseforge-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  NEOFORGE_REF: ${{ inputs.neoforge_ref || 'neoforge-1.21.1' }}

jobs:
  publish-forge:
    if: github.event_name == 'release' || inputs.loader == 'all' || inputs.loader == 'forge'
    runs-on: ubuntu-latest

    steps:
      - name: Check out Forge release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Remove local proxy settings
        run: sed -i -E '/^systemProp\.(http|https)\.proxy(Host|Port)=|^org\.gradle\.java\.home=/d' gradle.properties

      - name: Prepare CurseForge version
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
        run: echo "CURSEFORGE_VERSION=${RELEASE_VERSION#v}" >> "$GITHUB_ENV"

      - name: Validate CurseForge configuration
        env:
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          test -n "$CURSEFORGE_PROJECT_ID" || {
            echo "Missing repository variable CURSEFORGE_PROJECT_ID"
            exit 1
          }
          test -n "$CURSEFORGE_TOKEN" || {
            echo "Missing repository secret CURSEFORGE_TOKEN"
            exit 1
          }

      - name: Build Forge mod
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Verify Forge artifact
        env:
          CURSEFORGE_VERSION: ${{ env.CURSEFORGE_VERSION }}
        run: |
          find build/libs -maxdepth 1 -type f -name '*.jar' -print
          expected="qshop-forge-1.20.1-${CURSEFORGE_VERSION}.jar"
          test -f "build/libs/$expected"
          echo "CURSEFORGE_FILE=build/libs/$expected" >> "$GITHUB_ENV"

      - name: Prepare current Forge changelog
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          version="${RELEASE_VERSION#v}"
          awk -v version="$version" '
            /^##[[:space:]]+/ {
              heading = $2
              gsub(/^\[/, "", heading)
              gsub(/\].*$/, "", heading)
              if (found && heading != version) exit
              if (heading == version) found = 1
            }
            found { print }
          ' CHANGELOG.md > build/curseforge-changelog.md
          test -s build/curseforge-changelog.md || {
            echo "Missing CHANGELOG.md section for version $version"
            exit 1
          }

      - name: Publish Forge mod file
        uses: Kira-NT/mc-publish@v3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          files: ${{ env.CURSEFORGE_FILE }}
          version: ${{ env.CURSEFORGE_VERSION }}
          name: qshop-forge-1.20.1-${{ env.CURSEFORGE_VERSION }}
          version-type: release
          changelog-file: build/curseforge-changelog.md
          loaders: forge
          game-versions: 1.20.1
          java: 17

  publish-neoforge:
    if: github.event_name == 'release' || inputs.loader == 'all' || inputs.loader == 'neoforge'
    runs-on: ubuntu-latest

    steps:
      - name: Check out NeoForge source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.NEOFORGE_REF }}
          path: neoforge

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Remove local proxy settings
        working-directory: neoforge
        run: sed -i -E '/^systemProp\.(http|https)\.proxy(Host|Port)=|^org\.gradle\.java\.home=/d' gradle.properties

      - name: Prepare CurseForge version
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
        run: echo "CURSEFORGE_VERSION=${RELEASE_VERSION#v}" >> "$GITHUB_ENV"

      - name: Validate CurseForge configuration
        env:
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          test -n "$CURSEFORGE_PROJECT_ID" || {
            echo "Missing repository variable CURSEFORGE_PROJECT_ID"
            exit 1
          }
          test -n "$CURSEFORGE_TOKEN" || {
            echo "Missing repository secret CURSEFORGE_TOKEN"
            exit 1
          }

      - name: Build NeoForge mod
        working-directory: neoforge
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Verify NeoForge artifact
        env:
          CURSEFORGE_VERSION: ${{ env.CURSEFORGE_VERSION }}
        working-directory: neoforge
        run: |
          find build/libs -maxdepth 1 -type f -name '*.jar' -print
          expected="qshop-neoforge-1.21.1-${CURSEFORGE_VERSION}.jar"
          test -f "build/libs/$expected"
          echo "CURSEFORGE_FILE=neoforge/build/libs/$expected" >> "$GITHUB_ENV"

      - name: Prepare current NeoForge changelog
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
        working-directory: neoforge
        run: |
          version="${RELEASE_VERSION#v}"
          awk -v version="$version" '
            /^##[[:space:]]+/ {
              heading = $2
              gsub(/^\[/, "", heading)
              gsub(/\].*$/, "", heading)
              if (found && heading != version) exit
              if (heading == version) found = 1
            }
            found { print }
          ' CHANGELOG.md > build/curseforge-changelog.md
          test -s build/curseforge-changelog.md || {
            echo "Missing CHANGELOG.md section for version $version"
            exit 1
          }

      - name: Publish NeoForge mod file
        uses: Kira-NT/mc-publish@v3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          files: ${{ env.CURSEFORGE_FILE }}
          version: ${{ env.CURSEFORGE_VERSION }}
          name: qshop-neoforge-1.21.1-${{ env.CURSEFORGE_VERSION }}
          version-type: release
          changelog-file: neoforge/build/curseforge-changelog.md
          loaders: neoforge
          game-versions: 1.21.1
          java: 21
