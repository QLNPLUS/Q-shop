modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}

Features:
- Trade GUI with buy / sell / barter
- Multiple custom (non-item) currencies stored in player data
- Per-shop entries with configurable per-click quantity
- In-game editing of shops (GUI + commands)
- Multiple shops identified by id or uuid
- KubeJS integration to open shops
- FTB Quests integration: money tasks & rewards (optional)
- Global & per-player purchase limits with daily/weekly/monthly reset
- Commands executed on purchase (optional OP level and silent mode)
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="kubejs"
type="optional"
versionRange="[${kubejs_version},)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="ftbquests"
type="optional"
versionRange="[${ftb_quests_version},)"
ordering="AFTER"
side="BOTH"
