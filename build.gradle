plugins {
    id 'java-library'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id
base { archivesName = "${mod_id}-neoforge-1.21.1" }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

neoForge {
    version = neo_version

    runs {
        client {
            client()
        }
        server {
            server()
        }
        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
    maven { name = 'NeoForge'; url = 'https://maven.neoforged.net/releases/' }
    maven { name = 'Latvian'; url = 'https://maven.latvian.dev/releases' }
    maven { name = 'Architectury'; url = 'https://maven.architectury.dev/' }
    maven { name = 'FTB'; url = 'https://maven.ftb.dev/releases' }
}

// Optional local dependency directory for development; CI leaves it unset.
def localModsDir = findProperty('local_mods_dir')
        ? file(findProperty('local_mods_dir').toString())
        : null
def localMod = { String pattern ->
    localModsDir != null && localModsDir.exists()
            ? fileTree(localModsDir).matching { include pattern }.files
            : []
}
def addOptionalMod = { String configuration, String notation, String pattern ->
    def files = localMod(pattern)
    dependencies.add(configuration, files ? project.files(files) : notation)
}

dependencies {
    addOptionalMod('compileOnly', "dev.latvian.mods:kubejs-neoforge:${kubejs_version}", 'kubejs-neoforge-*.jar')
    addOptionalMod('compileOnly', 'dev.latvian.mods:rhino:2101.2.7-build.85', 'rhino-*.jar')
    addOptionalMod('compileOnly', "dev.ftb.mods:ftb-quests-neoforge:${ftb_quests_version}", '*ftb-quests-neoforge-*.jar')
    addOptionalMod('compileOnly', "dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}", 'ftb-library-neoforge-*.jar')
    addOptionalMod('compileOnly', "dev.ftb.mods:ftb-teams-neoforge:${ftb_teams_version}", '*ftb-teams-neoforge-*.jar')
    addOptionalMod('compileOnly', 'dev.architectury:architectury-neoforge:13.0.11', 'architectury-*-neoforge.jar')
    addOptionalMod('runtimeOnly', "dev.latvian.mods:kubejs-neoforge:${kubejs_version}", 'kubejs-neoforge-*.jar')
    addOptionalMod('runtimeOnly', 'dev.latvian.mods:rhino:2101.2.7-build.85', 'rhino-*.jar')
    addOptionalMod('runtimeOnly', "dev.ftb.mods:ftb-quests-neoforge:${ftb_quests_version}", '*ftb-quests-neoforge-*.jar')
    addOptionalMod('runtimeOnly', "dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}", 'ftb-library-neoforge-*.jar')
    addOptionalMod('runtimeOnly', "dev.ftb.mods:ftb-teams-neoforge:${ftb_teams_version}", '*ftb-teams-neoforge-*.jar')
    addOptionalMod('runtimeOnly', 'dev.architectury:architectury-neoforge:13.0.11', 'architectury-*-neoforge.jar')
}

tasks.named('processResources').configure {
    def replaceProperties = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version: neo_version,
            neo_version_range: neo_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description,
            kubejs_version: kubejs_version,
            ftb_quests_version: ftb_quests_version,
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') { expand replaceProperties }
}

jar {
    archiveFileName = "${mod_id}-neoforge-1.21.1-${mod_version}.jar"
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) { from components.java }
    }
    repositories {
        maven { url = layout.buildDirectory.dir('repo') }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
